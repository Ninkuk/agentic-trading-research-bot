    <script>
      // Pre-paint theme guard: mirror useTheme's resolution (localStorage
      // "theme": system default + manual override) so the first frame is
      // already the right scheme — no flash, in either direction.
      try {
        var t = localStorage.getItem("theme");
        var d =
          t === "dark" ||
          (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
